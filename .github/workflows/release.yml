name: Build and Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Install cross-compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu upx

      - name: Build linux/amd64
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -ldflags='-s -w -X main.Version=${{ github.ref_name }}' \
            -o dist/slinx_linux_amd64 .
          upx --best dist/slinx_linux_amd64 || echo "upx skipped (non-fatal)"

      - name: Build linux/arm64
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            go build -ldflags='-s -w -X main.Version=${{ github.ref_name }}' \
            -o dist/slinx_linux_arm64 .
          upx --best dist/slinx_linux_arm64 || echo "upx skipped (non-fatal)"

      # ── sing-box 核心 ──────────────────────────────────────────
      - name: Build sing-box linux/amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -tags 'with_v2ray_api,with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api' \
            -ldflags="-s -w -X github.com/sagernet/sing-box/constant.Version=$(grep 'sagernet/sing-box' go.mod | head -1 | awk '{print $2}')" \
            -o dist/sing-box_linux_amd64 github.com/sagernet/sing-box/cmd/sing-box
          gzip -f -k dist/sing-box_linux_amd64

      - name: Build sing-box linux/arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -tags 'with_v2ray_api,with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api' \
            -ldflags="-s -w -X github.com/sagernet/sing-box/constant.Version=$(grep 'sagernet/sing-box' go.mod | head -1 | awk '{print $2}')" \
            -o dist/sing-box_linux_arm64 github.com/sagernet/sing-box/cmd/sing-box
          gzip -f -k dist/sing-box_linux_arm64

      - name: List build artifacts
        run: ls -lh dist/

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*